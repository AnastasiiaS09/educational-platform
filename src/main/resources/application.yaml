spring:
  application:
    name: academy-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/platform?currentSchema=public
    username: myUser
    password: myPass
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

  liquibase:
    change-log: classpath:changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

store:
  jwt:
    secret: "teaching-store-jwt-secret-key-min-32-characters-long"
    expiration-ms: 2000000
    refresh-expiration-ms: 2592000000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG