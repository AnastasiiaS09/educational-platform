spring:
  application:
    name: academy-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/platform?currentSchema=public
    username: myUser
    password: myPass
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  store:
    jwt:
      secret: "teaching-store-jwt-secret-key-min-32-characters-long"
      expiration-ms: 86400000

  server:
    port: 8080

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.springframework.orm.jpa: DEBUG
      org.liquibase: INFO