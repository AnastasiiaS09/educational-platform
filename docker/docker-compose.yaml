version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-hansen
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --timeout 2000

  postgres:
    image: postgres:16-alpine
    container_name: postgres-platform
    restart: unless-stopped
    environment:
      POSTGRES_USER: myUser
      POSTGRES_PASSWORD: myPass
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_platform_data:/var/lib/postgresql/data
volumes:
  postgres_platform_data:
    name: postgres_platform_data